# Project-scoped Codex MCP registration for E:/codex/rwd-catalogue-mcp.
# Update absolute paths if this checkout moves. No API keys are stored here.
[mcp_servers.ema-rwe]
command = "E:/codex/rwd-catalogue-mcp/.venv/Scripts/python.exe"
args = ["-m", "ema_rwe.mcp.server"]
cwd = "E:/codex/rwd-catalogue-mcp"
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 180
env_vars = ["LLM_BACKEND", "LLM_BASE_URL", "LLM_MODEL", "LLM_API_KEY", "LLM_API_VERSION", "LLM_MAX_STEPS", "EMA_TERMINOLOGY_PATH", "OPENAI_API_KEY", "ANTHROPIC_API_KEY", "GEMINI_API_KEY", "AZURE_API_KEY", "AZURE_API_BASE", "AZURE_API_VERSION", "AWS_PROFILE", "AWS_REGION_NAME", "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_SESSION_TOKEN"]

[mcp_servers.ema-rwe.env]
EMA_DB_PATH = "E:/codex/rwd-catalogue-mcp/data/ema.sqlite3"
EMA_CACHE_DIR = "E:/codex/rwd-catalogue-mcp/cache/http"
EMA_PROTOCOL_DIR = "E:/codex/rwd-catalogue-mcp/data/protocols"
EMA_DRUG_DICTIONARY_PATH = "E:/codex/rwd-catalogue-mcp/data/ema-medicines.json"
EMA_IMPORT_DIR = "E:/codex/rwd-catalogue-mcp/data/imports"
EMA_CACHE_TTL_SECONDS = "2592000"
EMA_CATALOGUE_TTL_SECONDS = "2592000"

# Optional caller-side browser used only for a visible, user-initiated official CSV export.
# It is a separate MCP; ema-rwe never calls it or crawls /search itself.
[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@0.0.80", "--browser", "msedge", "--output-dir", "E:/codex/rwd-catalogue-mcp/data/imports"]
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 180
